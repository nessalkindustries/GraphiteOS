# Graphite theme palette. `graphite theme set <dir>` renders templates/*.tpl with these values.
name       = "Graphite"
mode       = "dark"
background = "#18191c"
surface    = "#222428"
overlay    = "#2c2f34"
border     = "#3a3d43"
foreground = "#d7d9dd"
muted      = "#868a92"
accent     = "#5eead4"
accent2    = "#38bdf8"
on_accent  = "#0f1a19"
red        = "#f2777a"
green      = "#8fd694"
yellow     = "#f0c674"
blue       = "#7cb7ff"
magenta    = "#c99cff"
cyan       = "#5eead4"
gtk_theme  = "adw-gtk3-dark"
icon_theme = "Papirus-Dark"
scheme     = "prefer-dark"
wallpaper  = "graphite-teal.png"
