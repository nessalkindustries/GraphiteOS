title    GraphiteOS install medium (%ARCH%, UEFI) with speech
sort-key 02
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
options  archisobasedir=%INSTALL_DIR% console=tty0 console=ttyS0,115200 archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_PARAMS%
