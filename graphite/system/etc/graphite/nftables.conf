#!/usr/bin/nft -f
# Graphite default-deny inbound firewall (graphite-config), loaded by
# graphite-firewall.service. Own table, so it never edits /etc/nftables.conf
# (owned by the nftables package) and coexists with Docker's tables.
# Outbound and forwarded traffic are not filtered here (Docker manages forwarding).
# To open a port, add e.g. `tcp dport 22 accept` below and: systemctl restart graphite-firewall
table inet graphite_filter
delete table inet graphite_filter
table inet graphite_filter {
  chain input {
    type filter hook input priority filter; policy drop;
    ct state invalid drop
    ct state { established, related } accept
    iif lo accept
    meta l4proto { icmp, ipv6-icmp } accept
    udp dport 546 ip6 daddr fe80::/64 accept comment "DHCPv6 client"
    udp sport 67 udp dport 68 accept comment "DHCPv4 client"
  }
}
