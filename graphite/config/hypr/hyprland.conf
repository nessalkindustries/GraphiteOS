# Graphite Hyprland config. Colours come from the active theme (Super+T or `graphite theme`).
# Keybinds: a trailing "# text" on a bind line is what Super+K shows.
monitor = ,preferred,auto,1
$terminal = kitty
$menu = rofi -show drun
$mod = SUPER

# Theme colours ($accent, $accent2, $border, $inactive + border gradients)
source = ~/.config/graphite/current/hyprland.conf

exec-once = graphite-bar
exec-once = graphite-wallpaper
exec-once = mako
exec-once = hypridle
exec-once = wl-paste --watch cliphist store
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = graphite-welcome

env = XCURSOR_THEME,capitaine-cursors
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1

general {
    gaps_in = 5
    gaps_out = 12
    border_size = 2
    resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 12
    rounding_power = 2.5
    active_opacity = 1.0
    inactive_opacity = 0.96
    dim_inactive = true
    dim_strength = 0.08
    shadow {
        enabled = true
        range = 18
        render_power = 3
        offset = 0, 4
        color = rgba(0000004d)
        color_inactive = rgba(00000026)
    }
    # blur is costly without a GPU (VMs, software rendering): set enabled = false there
    blur {
        enabled = true
        size = 6
        passes = 2
        noise = 0.015
        contrast = 1.0
        brightness = 1.0
        vibrancy = 0.18
        popups = true
    }
}

animations {
    enabled = true
    bezier = smooth,   0.25, 0.10, 0.25, 1.00
    bezier = snappy,   0.05, 0.90, 0.10, 1.05
    bezier = overshot, 0.13, 0.99, 0.29, 1.10
    bezier = linear,   0.00, 0.00, 1.00, 1.00
    # window animations must not scale contents (popin/gnomed/overshoot stretched kitty/fastfetch
    # while retiling): slide + fade only, and a non-overshooting curve for moves/resizes
    animation = windowsIn,   1, 4, smooth, slide
    animation = windowsOut,  1, 3, smooth, slide
    animation = windowsMove, 1, 4, smooth, slide
    animation = border,      1, 8, smooth
    animation = fade,        1, 4, smooth
    animation = fadeDim,     1, 5, smooth
    animation = layersIn,    1, 3, snappy, popin 92%
    animation = layersOut,   1, 2, smooth, fade
    animation = workspaces,  1, 4, overshot, slidefade 12%
    animation = specialWorkspace, 1, 4, snappy, slidevert
}

dwindle {
    preserve_split = true
}

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    animate_manual_resizes = false   # live resize without stretching contents
}

# Blur behind the floating bar, launcher and notifications
layerrule = blur on, ignore_alpha 0.3, match:namespace waybar
layerrule = blur on, ignore_alpha 0.3, match:namespace graphite-bar
layerrule = blur on, ignore_alpha 0.3, match:namespace rofi
layerrule = blur on, ignore_alpha 0.3, match:namespace notifications

# Games: fullscreen steam games, no tearing penalties
windowrule = immediate on, match:class ^(steam_app_.*)$
windowrule = float on, match:class ^(pavucontrol|nm-connection-editor|blueman-manager)$
windowrule = float on, match:title ^(Picture-in-Picture)$

# Apps
bind = $mod, Return, exec, $terminal                         # Terminal
bind = $mod, Space, exec, $menu                              # App launcher
bind = $mod, D, exec, $menu                                  # App launcher
bind = $mod, E, exec, thunar                                 # File manager
bind = $mod, Escape, exec, graphite-menu power               # Power menu
bind = $mod SHIFT, V, exec, graphite-menu clipboard          # Clipboard history
bind = $mod, period, exec, graphite-menu emoji               # Emoji picker
bind = $mod, T, exec, graphite-theme pick                    # Switch theme
bind = $mod, K, exec, graphite-keybinds                      # This cheatsheet
bind = $mod, L, exec, hyprlock                               # Lock screen
bind = $mod, G, exec, ~/.config/hypr/scripts/gamemode-toggle.sh  # Game mode on/off
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy         # Screenshot region to clipboard
bind = SHIFT, Print, exec, grim - | wl-copy                  # Screenshot screen to clipboard

# Windows
bind = $mod, Q, killactive                                   # Close window
bind = $mod, F, fullscreen                                   # Fullscreen
bind = $mod, V, togglefloating                               # Float / tile
bind = $mod, J, layoutmsg, togglesplit                                 # Swap split direction
bind = $mod SHIFT, E, exit                                   # Log out (quit Hyprland)
bind = $mod, left, movefocus, l                              # Focus left
bind = $mod, right, movefocus, r                             # Focus right
bind = $mod, up, movefocus, u                                # Focus up
bind = $mod, down, movefocus, d                              # Focus down
bind = $mod SHIFT, left, movewindow, l                       # Move window left
bind = $mod SHIFT, right, movewindow, r                      # Move window right
bind = $mod SHIFT, up, movewindow, u                         # Move window up
bind = $mod SHIFT, down, movewindow, d                       # Move window down
bindm = $mod, mouse:272, movewindow                          # Drag window
bindm = $mod, mouse:273, resizewindow                        # Resize window

# Workspaces
bind = $mod, 1, workspace, 1                                 # Workspace 1
bind = $mod, 2, workspace, 2                                 # Workspace 2
bind = $mod, 3, workspace, 3                                 # Workspace 3
bind = $mod, 4, workspace, 4                                 # Workspace 4
bind = $mod, 5, workspace, 5                                 # Workspace 5
bind = $mod SHIFT, 1, movetoworkspace, 1                     # Move to workspace 1
bind = $mod SHIFT, 2, movetoworkspace, 2                     # Move to workspace 2
bind = $mod SHIFT, 3, movetoworkspace, 3                     # Move to workspace 3
bind = $mod SHIFT, 4, movetoworkspace, 4                     # Move to workspace 4
bind = $mod SHIFT, 5, movetoworkspace, 5                     # Move to workspace 5
bind = $mod, S, togglespecialworkspace, scratch              # Scratchpad
bind = $mod SHIFT, S, movetoworkspace, special:scratch       # Move to scratchpad
bind = $mod, mouse_down, workspace, e+1                      # Next workspace
bind = $mod, mouse_up, workspace, e-1                        # Previous workspace

# Media keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+   # Volume up
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-        # Volume down
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle               # Mute
bindel = , XF86MonBrightnessUp, exec, brightnessctl s 5%+                               # Brightness up
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-                             # Brightness down
