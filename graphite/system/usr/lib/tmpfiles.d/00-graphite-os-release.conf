# Graphite identity: point /etc/os-release (which takes precedence over
# /usr/lib/os-release, see os-release(5)) at the Graphite file. No package owns
# /etc/os-release on Arch (systemd's etc.conf only creates it as a symlink), and
# /usr/lib/os-release stays owned and untouched by `filesystem`, so pacman never
# sees a conflict. This file sorts before systemd's etc.conf, so its entry wins.
L+ /etc/os-release - - - - ../usr/lib/graphite-release
