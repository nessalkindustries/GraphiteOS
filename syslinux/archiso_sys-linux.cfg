LABEL arch
TEXT HELP
Boot the GraphiteOS install medium on BIOS.
It allows you to install GraphiteOS or perform system maintenance.
ENDTEXT
MENU LABEL GraphiteOS install medium (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% console=tty0 console=ttyS0,115200 archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the GraphiteOS install medium on BIOS with speakup screen reader.
It allows you to install GraphiteOS or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL GraphiteOS install medium (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% console=tty0 console=ttyS0,115200 archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_PARAMS%
