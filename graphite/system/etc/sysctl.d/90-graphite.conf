# Graphite sysctl defaults (graphite-config). Small, documented set only.
# https://wiki.archlinux.org/title/Sysctl  https://wiki.archlinux.org/title/Security
# https://wiki.archlinux.org/title/Zram#Optimizing_swap_on_zram
# --- zram swap tuning (swap is compressed RAM, so swap early, no readahead)
vm.swappiness = 180
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
# --- light hardening
kernel.kptr_restrict = 1
kernel.dmesg_restrict = 1
kernel.yama.ptrace_scope = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.tcp_syncookies = 1
# vm.max_map_count: Arch's filesystem package already sets 1048576 (enough for games).
