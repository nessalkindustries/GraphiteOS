# Graphite idle policy: lock after 5 min, screen off after 10 min.
# No automatic suspend by default (stability first); add a listener with
# `on-timeout = systemctl suspend` if your hardware suspends reliably.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
